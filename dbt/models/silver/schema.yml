version: 2

models:
  - name: silver_podcasts
    description: One clean, deduplicated row per podcast feed.
    columns:
      - name: feed_url
        tests:
          - unique
          - not_null
      - name: podcast_title
        tests:
          - not_null

  - name: silver_episodes
    description: One clean row per successfully-fetched, deduplicated episode.
    columns:
      - name: episode_raw_id
        tests:
          - unique
          - not_null
      - name: podcast_feed_url
        tests:
          - not_null

  - name: silver_episode_enrichment
    description: Parsed LLM enrichment output, one row per episode's latest enrichment.
    columns:
      - name: episode_raw_id
        tests:
          - unique
          - not_null
      - name: quality_score
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 100
